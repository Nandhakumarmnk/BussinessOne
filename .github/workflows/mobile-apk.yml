name: Mobile APK

# Builds the Android APK for apps/mobile (Expo) and publishes it:
#   • as a downloadable workflow artifact (every run), and
#   • attached to a GitHub Release when triggered by a tag like `mobile-v1.0.0`.
#
# No Expo/EAS account is required: we `expo prebuild` to a native Android project and build with
# Gradle on the runner's preinstalled Android SDK. The release APK is debug-signed by the Expo
# template (installable on devices for pilots). For Play Store, add a real keystore + signing config.

on:
  workflow_dispatch:        # manual "Run workflow" button
  push:
    tags: ["mobile-v*"]

permissions:
  contents: write           # needed to create/attach the Release on tag builds

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build APK (Gradle)
        working-directory: apps/mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/apk-out"
          find android/app/build/outputs/apk -name '*.apk' -exec cp {} "$GITHUB_WORKSPACE/apk-out/" \;
          ls -la "$GITHUB_WORKSPACE/apk-out"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: business-one-android-apk
          path: apk-out/*.apk
          if-no-files-found: error

      - name: Attach APK to Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: apk-out/*.apk
