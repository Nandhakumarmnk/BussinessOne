name: Deploy

# Runs only after the CI workflow succeeds on main: build + push the API image to
# GHCR, then SSH to the e2-micro VM and roll the stack (docs/12 §5).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   VM_HOST     external IP / hostname of the GCE VM
#   VM_USER     SSH user on the VM (the user that owns ~/BussinessOne and is in the docker group)
#   VM_SSH_KEY  private SSH key whose public key is in the VM user's authorized_keys
#   GHCR_TOKEN  a GitHub PAT with read:packages, so the VM can pull the image
#               (skip if you make the GHCR package public — then drop the docker login line)
#
# NOTE: GHCR image paths must be lowercase. If your GitHub owner has capitals,
# replace ${{ github.repository_owner }} below with the lowercase owner string.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/erp-api:${{ github.event.workflow_run.head_sha }}
            ghcr.io/${{ github.repository_owner }}/erp-api:latest

      - name: Deploy to the VM over SSH
        uses: appleboy/ssh-action@v1
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: OWNER,SHA,GHCR_TOKEN
          script: |
            set -e
            cd ~/BussinessOne
            git fetch --all
            git checkout main
            git pull --ff-only
            # Authenticate to GHCR (remove these two lines if the package is public)
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$OWNER" --password-stdin
            IMG="ghcr.io/${OWNER}/erp-api:${SHA}"
            # Pin the deployed image tag into .env so manual `up` matches CI
            sed -i "s|^API_IMAGE=.*|API_IMAGE=${IMG}|" infra/docker/.env
            docker compose -f infra/docker/docker-compose.prod.yml --env-file infra/docker/.env pull
            docker compose -f infra/docker/docker-compose.prod.yml --env-file infra/docker/.env up -d
            # A recreated api container gets a new Docker IP; Caddy caches the old one and
            # would serve 503 "no upstreams". Restart Caddy so it re-resolves api:8080.
            docker compose -f infra/docker/docker-compose.prod.yml --env-file infra/docker/.env restart caddy
            sleep 5
            # Smoke test via the loopback-published API port
            curl -fsS http://127.0.0.1:8080/health/ready
            docker image prune -f
