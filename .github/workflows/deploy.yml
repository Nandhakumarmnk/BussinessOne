name: Deploy

# Runs after the CI workflow succeeds on main: build + push the API image to GHCR,
# then SSH to the e2-micro VM and roll the stack (docs/12 §5, infra/docker/DEPLOY.md).
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   VM_HOST     external IP / hostname of the GCE VM (e.g. 34.122.117.197)
#   VM_USER     SSH user on the VM that owns ~/BussinessOne (e.g. PC20_SIT)
#   VM_SSH_KEY  private SSH key whose public key is in the VM user's authorized_keys
#
# No GHCR PAT needed: the VM authenticates its pull with the workflow's GITHUB_TOKEN
# (valid for the duration of the run). GHCR image owner is lowercase (GHCR requirement).

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/nandhakumarmnk/erp-api
  WEB_IMAGE_REPO: ghcr.io/nandhakumarmnk/erp-web

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.event.workflow_run.head_sha }}
            ${{ env.IMAGE }}:latest

      - name: Build and push web image (SPA + Caddy)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE_REPO }}:${{ github.event.workflow_run.head_sha }}
            ${{ env.WEB_IMAGE_REPO }}:latest

      - name: Deploy to the VM over SSH
        uses: appleboy/ssh-action@v1
        env:
          IMG: ${{ env.IMAGE }}:${{ github.event.workflow_run.head_sha }}
          WEBIMG: ${{ env.WEB_IMAGE_REPO }}:${{ github.event.workflow_run.head_sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: IMG,WEBIMG,GHCR_TOKEN,ACTOR
          script: |
            set -e
            echo "$GHCR_TOKEN" | sudo docker login ghcr.io -u "$ACTOR" --password-stdin
            cd ~/BussinessOne
            git fetch origin && git reset --hard origin/main
            # Point the stack at the freshly pushed images and roll it
            sed -i "s|^API_IMAGE=.*|API_IMAGE=${IMG}|" infra/docker/.env
            grep -q '^WEB_IMAGE=' infra/docker/.env \
              && sed -i "s|^WEB_IMAGE=.*|WEB_IMAGE=${WEBIMG}|" infra/docker/.env \
              || echo "WEB_IMAGE=${WEBIMG}" >> infra/docker/.env
            sudo docker compose -f infra/docker/docker-compose.prod.yml --env-file infra/docker/.env pull
            sudo docker compose -f infra/docker/docker-compose.prod.yml --env-file infra/docker/.env up -d
            # Recreated api gets a new Docker IP; restart Caddy so it re-resolves (else 503)
            sudo docker compose -f infra/docker/docker-compose.prod.yml --env-file infra/docker/.env restart caddy
            # Poll health — first-boot EF migrate can take ~20-40s before Kestrel accepts traffic
            for i in $(seq 1 18); do
              if curl -fsS http://127.0.0.1:8080/health/ready >/dev/null 2>&1; then
                echo "API healthy after ~$((i*5))s"; break
              fi
              echo "waiting for API... ($i/18)"; sleep 5
            done
            curl -fsS http://127.0.0.1:8080/health/ready
            sudo docker image prune -f
