# Production stack for Option B (GCE e2-micro, Always Free) — see docs/01 §6.
# Runs the API + PostgreSQL + Caddy (auto-HTTPS) on a single VM.
#
# On the VM (one-time): copy infra/docker/.env.example -> infra/docker/.env and fill it in.
# Deploy / update (run from the repo root):
#   docker compose -f infra/docker/docker-compose.prod.yml --env-file infra/docker/.env up -d
#
# The API image is pulled from GHCR (pushed by .github/workflows/deploy.yml).
# Postgres is NOT publicly exposed — only the API (internal network) and the VM's
# loopback (for health checks) can reach it. Caddy is the only thing on 80/443.

services:
  db:
    image: postgres:15-alpine
    container_name: erp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-erp}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/docker/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No published ports: reachable only on the internal Docker network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-erp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${API_IMAGE:?set API_IMAGE in infra/docker/.env (e.g. ghcr.io/<owner>/erp-api:<sha>)}
    container_name: erp-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB:-erp};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}"
      # Applies pending EF migrations on startup (idempotent). See docs/12 §5.
      Database__AutoMigrate: "true"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in infra/docker/.env (32+ random chars)}
      Cors__Origins__0: ${WEB_ORIGIN:?set WEB_ORIGIN in infra/docker/.env}
      # Expose Swagger UI in Production when SWAGGER_ENABLED=true (default off)
      Swagger__Enabled: ${SWAGGER_ENABLED:-false}
      # File storage: Local (disk) or Firebase (Cloud Storage). See infra/docker/.env.example
      # and DEPLOY.md §8b. The service-account key is passed inline (no file mount) so the
      # automated deploy has no dependency on a file existing on the VM.
      Storage__Provider: ${STORAGE_PROVIDER:-Local}
      Storage__Firebase__Bucket: ${FIREBASE_BUCKET:-}
      Storage__Firebase__CredentialsJson: ${FIREBASE_CREDENTIALS_JSON:-}
    ports:
      # Loopback only — lets the VM curl /health/ready; not reachable from the internet.
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

  # Edge: serves the React SPA (apps/web) and reverse-proxies API routes to `api`.
  # Image is built from infra/docker/web.Dockerfile (Caddy + built SPA + Caddyfile).
  caddy:
    image: ${WEB_IMAGE:?set WEB_IMAGE in infra/docker/.env (e.g. ghcr.io/<owner>/erp-web:<sha>)}
    container_name: erp-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in infra/docker/.env (must have a DNS A record to this VM)}
    volumes:
      - caddy_data:/data       # Let's Encrypt certs (persisted so they survive restarts)
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
